services:
  - type: web
    name: baron-turkiye
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PUBLIC_URL
        value: https://baron-turkiye.onrender.com
      - key: SESSION_SECRET
        generateValue: true   # oturum anahtarlarını imzalar; Render otomatik üretir
      - key: DATABASE_URL
        sync: false           # PostgreSQL bağlantı adresini panelden gir (hesaplar kalıcı olsun)
