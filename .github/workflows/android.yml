# Google Play için imzalı Android paketi (.aab) üretir.
# Kullanım: GitHub → Actions → "Android paketi (Play Store)" → Run workflow
name: Android paketi (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Sürüm adı (örn. 1.0.0, 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub'ın Ubuntu makinesinde Android SDK hazır kurulu gelir; yalnızca gereken parçaları ekliyoruz
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)"; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Yükleme anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 gizli değişkeni eksik (Settings → Secrets and variables → Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/baron-upload.keystore"
          ls -l "$RUNNER_TEMP/baron-upload.keystore"

      - name: Paketi derle (.aab + test için .apk)
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/baron-upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: baron
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_HOST: ${{ vars.APP_HOST }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: baron-turkiye-${{ github.event.inputs.version_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
